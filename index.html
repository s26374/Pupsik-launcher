<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pupsik Launcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: #0d0914;
      color: #f3e8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .launcher {
      width: 900px;
      height: 540px;
      background: linear-gradient(135deg, #170f24 0%, #24143d 100%);
      border: 1px solid #4c2882;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(139, 92, 246, 0.25);
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 220px;
      background: rgba(13, 9, 20, 0.6);
      border-right: 1px solid #351c5c;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #c084fc;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }
    .nav-item {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      color: #a78bfa;
      transition: 0.2s;
    }
    .nav-item.active, .nav-item:hover {
      background: #5b21b6;
      color: #ffffff;
    }
    .profile {
      background: #1e1233;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #4c2882;
      font-size: 14px;
    }
    .main {
      flex: 1;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .banner {
      background: linear-gradient(90deg, #4c1d95, #7e22ce);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(126, 34, 206, 0.3);
    }
    .banner h1 { font-size: 28px; margin-bottom: 8px; }
    .banner p { color: #e9d5ff; font-size: 15px; }
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(13, 9, 20, 0.5);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #3b1e66;
    }
    select {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      background: #1a102b;
      color: #f3e8ff;
      border: 1px solid #6d28d9;
      font-size: 15px;
      outline: none;
    }
    .play-btn {
      padding: 14px 42px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #9333ea, #6d28d9);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(147, 51, 234, 0.5);
      transition: 0.2s;
    }
    .play-btn:hover { transform: translateY(-2px); box-shadow: 0 0 28px rgba(168, 85, 247, 0.8); }
  </style>
</head>
<body>
  <div class="launcher">
    <div class="sidebar">
      <div>
        <div class="logo">PUPSIK</div>
        <div class="nav-item active">Главная</div>
        <div class="nav-item">Сборки</div>
        <div class="nav-item">Настройки</div>
      </div>
      <div class="profile">Игрок: <b>PupsikUser</b></div>
    </div>
    <div class="main">
      <div class="banner">
        <h1>Pupsik Launcher v1.0</h1>
        <p>Быстрый запуск, фиолетовая неоновая тема и удобное управление версиями.</p>
      </div>
      <div class="controls">
        <select>
          <option>Версия 1.21.4 (Основная)</option>
          <option>Версия 1.20.4 (PvP Сборка)</option>
          <option>Версия 1.16.5 (Классика)</option>
        </select>
        <button class="play-btn" onclick="alert('Запуск Pupsik Launcher...')">ИГРАТЬ</button>
      </div>
    </div>
  </div>
</body>
</html>
